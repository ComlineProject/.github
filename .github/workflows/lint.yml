name: Lint

# Lints the workflows of the repository it runs in (actionlint), and, when
# there is one, a Renovate config. Runs on this repository's own pushes and
# pull requests, and is a reusable workflow for other repositories:
#
#   jobs:
#     lint:
#       uses: ComlineProject/.github/.github/workflows/lint.yml@<sha> # <tag>
#       with:
#         renovate-config: renovate.json   # optional
#
# On this repository's own triggers `inputs` is empty, so a default can't be
# relied on there: the Renovate job falls back to renovate-config.json when
# this repository is the one running.
#
# Needs no more than `contents: read`. The concurrency group below is this
# workflow's own; it can't clash with a caller's differently named group.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      renovate-config:
        description: >-
          A Renovate config to validate with `--strict`, relative to the
          repository root; empty to skip the check.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rhysd/actionlint 1.7.12, with shellcheck and pyflakes in the image.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  renovate-config:
    name: renovate-config.json
    if: inputs.renovate-config != '' || github.repository == 'ComlineProject/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate
        env:
          CONFIG: ${{ inputs.renovate-config || 'renovate-config.json' }}
        run: npx --yes --package renovate@44.192.2 -- renovate-config-validator --strict "$CONFIG"
